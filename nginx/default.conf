# Define el servidor web.
server {
    # nginx escucha peticiones en el puerto 80.
    listen 80;

    # Acepta cualquier nombre de servidor.
    server_name _;

    # Carpeta donde estarán los archivos de WordPress.
    root /var/www/html;

    # Archivo principal que debe abrir.
    index index.php;

    # Tamaño máximo permitido para las peticiones.
    client_max_body_size 64M;

    # Gestiona las peticiones a las páginas.
    location / {
        # Busca el archivo o dirige la petición a WordPress.
        try_files $uri $uri/ /index.php?$args;
    }

    # Gestiona los archivos PHP.
    location ~ \.php$ {
        # Carga los parámetros necesarios para FastCGI.
        include fastcgi_params;

        # Envía PHP al contenedor WordPress por el puerto 9000.
        fastcgi_pass wordpress:9000;

        # Indica la ruta del archivo PHP que debe ejecutarse.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}